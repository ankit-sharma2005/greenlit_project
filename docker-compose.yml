name: greenlit

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-greenlit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-greenlit}
      POSTGRES_DB: ${POSTGRES_DB:-greenlit}
    ports:
      - "${POSTGRES_PORT:-5436}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-greenlit} -d ${POSTGRES_DB:-greenlit}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6382}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./backend
    restart: unless-stopped
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://greenlit:greenlit@postgres:5432/greenlit}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-dev-insecure-key-change-me-0123456789}
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Both loopback spellings, so the page works whether it is opened at
      # http://localhost:5177 or http://127.0.0.1:5177. A browser reports a
      # refused CORS preflight as "Cannot reach the GreenLit API".
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5177,http://127.0.0.1:5177}
      DEFAULT_TIMEOUT_SECONDS: ${DEFAULT_TIMEOUT_SECONDS:-60}
      DEFAULT_RUN_PARALLELISM: ${DEFAULT_RUN_PARALLELISM:-2}
    ports:
      - "${API_PORT:-8003}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: celery -A app.celery_app.celery worker --loglevel=INFO
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://greenlit:greenlit@postgres:5432/greenlit}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-dev-insecure-key-change-me-0123456789}
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8003}
    ports:
      - "${WEB_PORT:-5177}:5173"
    volumes:
      # Mount sources only. Never mount over /app/node_modules (it would hide the
      # dependencies installed by `npm ci` in the image).
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # Built-in demo (spec section 10): the college helpdesk app, answered
  # correctly by demo-app and wrongly by demo-app-broken, so "Try the demo"
  # can show a GO and a NO-GO with no model and no setup. Both run the same
  # image and module; only MODE differs. Started with:
  #   docker compose --profile demo up -d
  demo-app:
    build:
      context: ./backend
    restart: unless-stopped
    command: uvicorn app.demo_server:app --host 0.0.0.0 --port 9000
    profiles: ["demo"]
    environment:
      MODE: good
      APP_ENV: development
    ports:
      - "${DEMO_APP_PORT:-9301}:9000"
    volumes:
      - ./backend:/app
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:9000/healthz', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  demo-app-broken:
    build:
      context: ./backend
    restart: unless-stopped
    command: uvicorn app.demo_server:app --host 0.0.0.0 --port 9000
    profiles: ["demo"]
    environment:
      MODE: broken
      APP_ENV: development
    ports:
      - "${DEMO_APP_BROKEN_PORT:-9302}:9000"
    volumes:
      - ./backend:/app
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:9000/healthz', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres-data:
